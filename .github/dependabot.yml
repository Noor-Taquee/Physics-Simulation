version: 2
updates:
  - package-ecosystem: "uv"
    versioning-strategy: increase
    directory: "/"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "05:00"
      timezone: "Asia/Kolkata"
    commit-message:
      prefix: "build(deps)"
      prefix-development: "build(deps-dev)"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
